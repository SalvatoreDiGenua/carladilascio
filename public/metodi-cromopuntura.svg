<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Sfondo armonico -->
  <rect width="200" height="200" rx="30" fill="#F7F5F0" />

  <!-- Punto d'applicazione / Onda energetica di sfondo -->
  <circle cx="65" cy="135" r="40" fill="none" stroke="#E8D8C8" stroke-width="2" opacity="0.6" />
  <circle cx="65" cy="135" r="25" fill="none" stroke="#C8B29B" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="65" cy="135" r="5" fill="#6B5B52" opacity="0.3" />

  <!-- Fascio di Luce Cromatico (Spettro a cono stilizzato) -->
  <polygon points="65,135 15,60 115,15" fill="url(#rainbow-grad)" opacity="0.75" />

  <!-- Penna per Cromopuntura (Impugnatura e puntale) -->
  <g transform="rotate(-45 115 85)">
    <!-- Corpo della penna -->
    <rect x="100" y="70" width="90" height="24" rx="12" fill="#6B5B52" />
    <!-- Inserti metallici / Pulsanti -->
    <rect x="115" y="66" width="60" height="4" rx="2" fill="#8A9A86" />
    <rect x="150" y="76" width="16" height="12" rx="4" fill="#E3A857" />
    <!-- Impugnatura dorata -->
    <path d="M 85,73 L 100,70 L 100,94 L 85,91 Z" fill="#C8B29B" />
    <!-- Cono frontale penna -->
    <polygon points="85,73 65,77 65,87 85,91" fill="#8A9A86" />
    <!-- Cristallo di Quarzo sulla punta -->
    <polygon points="65,77 50,82 65,87" fill="#FFFFFF" stroke="#C8B29B" stroke-width="1.5" />
  </g>

  <!-- Bagliore ed emissione sulla punta del cristallo -->
  <circle cx="65" cy="135" r="8" fill="#FFFFFF" />
  <circle cx="65" cy="135" r="4" fill="#E3A857" />

  <!-- Definizione Gradiente Spettro Cromatico -->
  <defs>
    <linearGradient id="rainbow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C87A6B" /> <!-- Rosso/Terracotta -->
      <stop offset="25%" stop-color="#E3A857" /> <!-- Arancio/Ocra -->
      <stop offset="50%" stop-color="#8A9A86" /> <!-- Verde Salvia -->
      <stop offset="75%" stop-color="#6B8A9A" /> <!-- Blu Oio -->
      <stop offset="100%" stop-color="#B48A9C" /> <!-- Viola/Rosa -->
    </linearGradient>
  </defs>
</svg>